# Lints, builds and tests the library across the supported Node release lines.
# For more information see: https://docs.github.com/actions/guides/building-and-testing-nodejs

name: Tests & Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 and 24 are LTS, 26 is Current. Older lines are end-of-life.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "yarn"

      # The Yarn release is committed to .yarn/releases and pinned via the
      # packageManager field, so Corepack resolves the right version on its own.
      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Test
        run: yarn test
