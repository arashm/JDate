# Lints, builds and tests the library across the supported Node release lines.
# For more information see: https://docs.github.com/actions/guides/building-and-testing-nodejs

name: Tests & Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 22 and 24 are LTS, 26 is Current. Older lines are end-of-life.
        node-version: [22.x, 24.x, 26.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      # `npm ci` installs strictly from package-lock.json and fails if the two
      # have drifted, which is what makes the CI install reproducible.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # These three check lib/, so they run after the build. test:types compiles
      # the fixtures in tests/types against the shipped declarations;
      # test:bundles checks that the bundles still have the export shapes those
      # declarations describe; test:exports checks that every way of loading the
      # package resolves to them.
      - name: Type declarations
        run: npm run test:types

      - name: Bundle shapes
        run: npm run test:bundles

      - name: Package exports
        run: npm run test:exports
